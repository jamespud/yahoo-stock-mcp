name: Live provider canary

on:
  schedule:
    - cron: "17 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-provider-canary
  cancel-in-progress: false

jobs:
  providers:
    name: Live provider contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Both providers gate this job. Investing is a real data source reached through the native
      # TLS transport, so a silent Cloudflare or contract regression must fail the schedule
      # instead of being logged as an informational warning.
      - run: npm run canary:providers
