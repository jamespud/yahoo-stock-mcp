name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # No database service: SQLite is the only backend and it is created on demand.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  package:
    name: Package contents
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Verify npm package contents
        run: npm run verify:pack
