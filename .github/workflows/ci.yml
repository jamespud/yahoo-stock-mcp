name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # No database service: SQLite is the only backend and it is created on demand.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  package:
    name: Package contents
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Verify npm package contents
        run: npm run verify:pack

  quant:
    name: Quant runtime / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./quant pytest hypothesis
      - run: python -m pytest quant/tests
      - run: npm ci
      - run: npm run build
      - run: npm run test:quant-mcp
        env:
          QUANT_PYTHON: python

  quant-sandbox:
    name: Quant isolated Python acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./quant pytest hypothesis
      - name: Provision trusted test image and resolve its immutable identity
        run: |
          docker pull python:3.12-alpine
          docker image inspect python:3.12-alpine --format 'QUANT_SANDBOX_IMAGE={{.Id}}' >> "$GITHUB_ENV"
      - run: python -m pytest quant/tests
      - run: npm ci
      - run: npm run build
      - run: npm run test:quant-mcp
        env:
          QUANT_PYTHON: python
