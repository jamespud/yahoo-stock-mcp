name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: yahoo_stock_mcp
          MYSQL_USER: stock
          MYSQL_PASSWORD: stock123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      YAHOO_STOCK_MCP_DATABASE_URL: mysql://stock:stock123@127.0.0.1:3306/yahoo_stock_mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  go:
    name: Go sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/gqlproxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/gqlproxy/go.mod
          cache-dependency-path: cmd/gqlproxy/go.mod

      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  package:
    name: Package contents
    runs-on: ubuntu-latest
    needs: [node, go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/gqlproxy/go.mod
          cache-dependency-path: cmd/gqlproxy/go.mod

      - run: npm ci
      - run: npm run build:all
      - name: Verify npm package contents
        run: npm pack --dry-run --ignore-scripts
