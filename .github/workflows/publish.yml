name: Publish to npm

on:
  push:
    tags:
      - "v*"
  # Manual runs are allowed, but the job below refuses to publish unless the selected ref is a
  # v* tag whose name matches package.json, so dispatching from a branch cannot release.
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC). No long-lived NPM_TOKEN is used.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `registry-url` on purpose: setup-node writes a placeholder auth token into .npmrc,
      # which interferes with OIDC authentication for public packages.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require a v* tag that matches package.json
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::publishing requires a tag ref; got ref_type=${GITHUB_REF_TYPE} ref=${GITHUB_REF}"
            exit 1
          fi
          node scripts/verify-release-tag.mjs "${GITHUB_REF_NAME}"

      - name: Verify the npm CLI supports Trusted Publishing
        run: |
          node -e '
            const { execSync } = require("node:child_process");
            const v = execSync("npm --version").toString().trim();
            const [major, minor, patch] = v.split(".").map(Number);
            if (
              ![major, minor, patch].every(Number.isInteger) ||
              major < 11 ||
              (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))
            ) {
              console.error(`npm ${v} is too old for OIDC trusted publishing; need >= 11.5.1`);
              process.exit(1);
            }
            console.log(`npm ${v} supports trusted publishing`);
          '

      - run: npm ci

      - name: Validate TypeScript and tests
        run: |
          npm run typecheck
          npm test

      - name: Build TypeScript
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts

      # No NODE_AUTH_TOKEN: authentication comes from the OIDC exchange with npm.
      - name: Publish
        run: npm publish --ignore-scripts
