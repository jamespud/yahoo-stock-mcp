name: Quant regression

on:
  push:
    branches: [main]
    paths:
      - 'quant/**'
      - 'src/quant/**'
      - 'src/mcp/server.ts'
      - 'tests/quant-eval/**'
      - 'scripts/test-quant-mcp.ts'
      - 'scripts/quant-eval/**'
      - 'scripts/run-quant-regression.py'
      - 'scripts/quant-research-regression.py'
      - 'scripts/refresh-quant-summary.mjs'
      - 'docs/evidence/**'
      - 'skills/quant-*/**'
      - 'skills/references/**'
      - 'plugins/yahoo-stock-mcp/skills/quant-*/**'
      - 'plugins/yahoo-stock-mcp/skills/references/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/quant-regression.yml'
  pull_request:
    paths:
      - 'quant/**'
      - 'src/quant/**'
      - 'src/mcp/server.ts'
      - 'tests/quant-eval/**'
      - 'scripts/test-quant-mcp.ts'
      - 'scripts/quant-eval/**'
      - 'scripts/run-quant-regression.py'
      - 'scripts/quant-research-regression.py'
      - 'scripts/refresh-quant-summary.mjs'
      - 'docs/evidence/**'
      - 'skills/quant-*/**'
      - 'skills/references/**'
      - 'plugins/yahoo-stock-mcp/skills/quant-*/**'
      - 'plugins/yahoo-stock-mcp/skills/references/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/quant-regression.yml'
  schedule:
    - cron: '20 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quant:
    name: Quant runtime / Python 3.12
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './quant[alpha,options,theta]' pytest hypothesis
      - name: Provision trusted sandbox test image
        run: |
          docker pull python:3.12-alpine
          docker image inspect python:3.12-alpine --format 'QUANT_SANDBOX_IMAGE={{.Id}}' >> "$GITHUB_ENV"
      - name: Run Quant regression
        run: |
          set -o pipefail
          mkdir -p reports/alpha-data-validity
          python scripts/run-quant-regression.py | tee reports/alpha-data-validity/regression-output.txt
      - run: npm ci
      - run: npm run build
      - run: npm run test:quant-mcp
        env:
          QUANT_PYTHON: python
      - run: npm run test:quant-alpha-mcp
        env:
          QUANT_PYTHON: python
      - run: npm run test:quant-alpha-e2e
        env:
          QUANT_PYTHON: python
      - run: npm run test:quant-alpha-diagnostics
        env:
          QUANT_PYTHON: python
      - run: npm run test:quant-alpha-scalability
        env:
          QUANT_PYTHON: python
      - run: npm run test:quant-data-validity
        env:
          QUANT_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-reports-3.12
          path: reports/
          retention-days: 7

  quant-compat:
    name: Quant compatibility / Python 3.14
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install './quant[alpha,options,theta]' pytest hypothesis
      - name: Run Quant regression
        run: |
          set -o pipefail
          mkdir -p reports/alpha-data-validity
          python scripts/run-quant-regression.py | tee reports/alpha-data-validity/regression-output.txt
      - run: npm ci
      - run: npm run build
      - run: npm run test:quant-mcp
        env:
          QUANT_PYTHON: python
      - run: npm run test:quant-alpha-mcp
        env:
          QUANT_PYTHON: python
      - run: npm run test:quant-alpha-e2e
        env:
          QUANT_PYTHON: python
      - run: npm run test:quant-alpha-diagnostics
        env:
          QUANT_PYTHON: python
      - run: npm run test:quant-alpha-scalability
        env:
          QUANT_PYTHON: python
