name: Quant regression

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  quant:
    name: Quant runtime / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install './quant[alpha,options,theta]' pytest hypothesis
      - run: python scripts/run-quant-regression.py
      - run: npm ci
      - run: npm run build
      - run: npm run test:skills
      - run: npm run test:skills:quant
        env:
          QUANT_PYTHON: python
      - run: npm run test:plugin
      - run: npm run test:quant-mcp
        env:
          QUANT_PYTHON: python
      - run: npm run test:quant-alpha-mcp
        env:
          QUANT_PYTHON: python
      - run: npm run test:quant-alpha-e2e
        env:
          QUANT_PYTHON: python

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-reports-${{ matrix.python }}
          path: reports/

  quant-sandbox:
    name: Quant isolated Python acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install './quant[alpha,options,theta]' pytest hypothesis
      - name: Provision trusted test image and resolve its immutable identity
        run: |
          docker pull python:3.12-alpine
          docker image inspect python:3.12-alpine --format 'QUANT_SANDBOX_IMAGE={{.Id}}' >> "$GITHUB_ENV"
      - run: python scripts/run-quant-regression.py
      - run: npm ci
      - run: npm run build
      - run: npm run test:skills
      - run: npm run test:skills:quant
        env:
          QUANT_PYTHON: python
      - run: npm run test:plugin
      - run: npm run test:quant-mcp
        env:
          QUANT_PYTHON: python

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-sandbox-reports
          path: reports/
