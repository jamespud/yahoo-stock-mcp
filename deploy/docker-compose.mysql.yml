# 可选开发用 MySQL（基础设施，不属于 MCP server 本体）。
# 生产环境请使用自有 MySQL，只需在 MCP server 配置 DATABASE_URL。
services:
  mysql:
    image: mysql:8.4
    container_name: yahoo-stock-mcp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: yahoo_stock_mcp
      MYSQL_USER: stock
      MYSQL_PASSWORD: stock123
    ports:
      - "3306:3306"
    volumes:
      - yahoo_stock_mcp_data:/var/lib/mysql
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  yahoo_stock_mcp_data:
